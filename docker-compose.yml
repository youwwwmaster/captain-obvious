services:
  bot:
    build: .
    container_name: captain-obvious-bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBHOOK_PORT}:${WEBHOOK_PORT}"
    environment:
      - WEBHOOK_PORT=${WEBHOOK_PORT}
    env_file:
      - .env
    volumes:
      - ./prompt.md:/app/prompt.md
      - ./terms.md:/app/terms.md
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16.15-alpine
    container_name: captain-obvious-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: captain_obvious
      POSTGRES_USER: captain
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задай DB_PASSWORD в .env — см. env.example}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captain"]
      interval: 5m
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s

volumes:
  postgres-data:
